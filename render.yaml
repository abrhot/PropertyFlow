# Render Blueprint for the PropertyFlow API and its database.
#
# The web app is deployed separately on Vercel (root directory apps/web); this
# file covers the NestJS API and the Postgres instance it talks to.
#
# Migrations are applied from a developer machine against the database's
# *external* connection string (copy it from the Render dashboard) rather than
# from a preDeployCommand, which is not guaranteed on free instances:
#
#   pnpm --filter @propertyflow/database db:deploy
#
# Frankfurt is the closest available region to Ethiopia, and the API and the
# database must share a region to talk over the private network.
#
# NOTE: a free Render Postgres is deleted 30 days after creation (plus a 14-day
# grace period). Upgrade it before then if this needs to outlive the demo.
databases:
  - name: propertyflow-db
    plan: free
    region: frankfurt
    postgresMajorVersion: '17'

services:
  - type: web
    name: propertyflow-api
    runtime: node
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    # corepack activates the pnpm version pinned in the root package.json.
    # The `...` suffix builds the packages/* workspaces the API imports.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @propertyflow/api... build
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      # Wired automatically to the database declared above — nothing to paste.
      - key: DATABASE_URL
        fromDatabase:
          name: propertyflow-db
          property: connectionString
      # Set to the Vercel URL once the web app exists. CORS rejects every
      # browser request until this matches exactly, scheme included.
      - key: WEB_ORIGIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      # true also switches the refresh cookie to SameSite=None, which it must be
      # while the web app (Vercel) and the API (Render) are on different sites.
      - key: COOKIE_SECURE
        value: 'true'
      # Deliberately empty: scopes the cookie to this host. Shared platform
      # domains like .onrender.com cannot be used as a cookie domain.
      - key: COOKIE_DOMAIN
        value: ''

# Render Blueprint for the PropertyFlow API.
#
# The web app is deployed separately on Vercel (root directory apps/web) and the
# database is a free Neon project, so this file describes the NestJS API alone.
#
# Migrations are applied from a developer machine against the Neon connection
# string rather than from a preDeployCommand, because pre-deploy is not
# guaranteed on free instances and Neon is reachable from anywhere:
#
#   pnpm --filter @propertyflow/database db:deploy
#
# Frankfurt is the closest available region to Ethiopia; create the Neon project
# in eu-central-1 so the API and the database are not on different continents.
services:
  - type: web
    name: propertyflow-api
    runtime: node
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    # corepack activates the pnpm version pinned in the root package.json.
    # The `...` suffix builds the packages/* workspaces the API imports.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @propertyflow/api... build
    startCommand: node apps/api/dist/main.js
    envVars:
      - key: NODE_ENV
        value: production
      # Neon connection string — use the DIRECT (unpooled) URL so Prisma
      # migrations work, and keep ?sslmode=require.
      - key: DATABASE_URL
        sync: false
      # Set to the Vercel URL once the web app exists. CORS rejects every
      # browser request until this matches exactly, scheme included.
      - key: WEB_ORIGIN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      # true also switches the refresh cookie to SameSite=None, which it must be
      # while the web app (Vercel) and the API (Render) are on different sites.
      - key: COOKIE_SECURE
        value: 'true'
      # Deliberately empty: scopes the cookie to this host. Shared platform
      # domains like .onrender.com cannot be used as a cookie domain.
      - key: COOKIE_DOMAIN
        value: ''
